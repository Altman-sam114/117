name: MD Journal App Store Delivery

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character main commit already accepted by full validation
        required: true
        type: string
      validation_run_id:
        description: Successful full validation run ID for that exact source
        required: true
        type: string
      validation_attempt:
        description: Latest successful attempt number of that validation run
        required: true
        type: string
      team_id:
        description: Actual 10-character Apple Developer Team ID
        required: true
        type: string
      operation:
        description: Export only, or explicitly deliver to Apple for TestFlight processing
        type: choice
        options: [export, testflight]
        default: export
      allow_temp_cleanup:
        description: Confirm deletion of this run's temporary signing keys and profiles, never journals
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: mdjournal-app-store-delivery
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
  VALIDATION_ATTEMPT: ${{ inputs.validation_attempt }}
  TEAM_ID: ${{ inputs.team_id }}
  DELIVERY_OPERATION: ${{ inputs.operation }}
  ALLOW_TEMP_CLEANUP: ${{ inputs.allow_temp_cleanup }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verified-input:
    name: Verify exact release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: automation
          persist-credentials: false
      - name: Reject incomplete dispatch
        run: python3 automation/script/app_store_release.py inputs
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Verify full run, protected environment and both immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 automation/script/app_store_release.py gate
          "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/release-input"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: verified-release-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-input/release-input.json
            ${{ runner.temp }}/release-input/MDJournal-iOS-unsigned.xcarchive.zip
          if-no-files-found: error
          retention-days: 7

  signed-delivery:
    name: Sign verified archive and optionally deliver
    needs: verified-input
    environment: app-store
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verified-release-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-input
      - name: Export verified signed IPA, optionally upload to Apple
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
        run: bash script/sign_app_store_release.sh "$RUNNER_TEMP/release-input" "$RUNNER_TEMP/app-store-output"
      - name: Always clean this run's approved temporary signing material
        if: always() && inputs.allow_temp_cleanup
        run: bash script/sign_app_store_release.sh cleanup
      - name: Preserve only redacted failure status
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mdjournal-delivery-failure-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-store-output/failure-summary.json
          if-no-files-found: warn
          retention-days: 7
      - name: Publish signed delivery evidence, never signing secrets
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mdjournal-app-store-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/app-store-output/MDJournal.ipa
            ${{ runner.temp }}/app-store-output/app-store-release.json
            ${{ runner.temp }}/app-store-output/export.log
          if-no-files-found: error
          retention-days: 7
