name: MD Journal CI Results

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-results:
    name: Build and Package Results
    runs-on: macos-15
    timeout-minutes: 25
    env:
      RESULT_DIR: ci-results
      VERSION: v0.95
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      TEST_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-18-5
      PYTHONDONTWRITEBYTECODE: '1'
      PROJECT_NAME: MD Journal
      SCHEME: MDJournal
      BUILD_DESTINATION: generic/platform=iOS
      MACCATALYST_BUILD_DESTINATION: generic/platform=macOS,variant=Mac Catalyst

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          branch_slug="${GITHUB_REF_NAME//\//-}"
          short_sha="${GITHUB_SHA::7}"
          echo "branch_slug=${branch_slug}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Prepare result directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"

      - name: Static checks
        id: static_checks
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## git diff --check"
            git diff --check
            echo
            echo "## plutil -lint MDJournal.xcodeproj/project.pbxproj"
            plutil -lint MDJournal.xcodeproj/project.pbxproj
            echo
            echo "## xcrun swiftc -parse"
            swift_files=$(git ls-files 'MDJournal/*.swift' 'MDJournal/**/*.swift')
            xcrun swiftc -parse -parse-as-library $swift_files
            echo
            echo "## CI simulator selection fixture checks"
            python3 -m unittest discover -s script/tests -v
          } 2>&1 | tee "$RESULT_DIR/static-checks.log"

      - name: Prepare cloud simulator
        id: test_destination
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Pinned toolchain and runner"
            uname -m
            xcrun xcodebuild -version
            xcrun simctl list runtimes
            xcrun simctl list devices available --json > "$RESULT_DIR/simulator-devices.json"
            destination=$(python3 script/ci_simulator.py \
              --devices "$RESULT_DIR/simulator-devices.json" --runtime "$TEST_RUNTIME" \
              --report "$RESULT_DIR/simulator-selection.json")
            echo "destination=${destination}" >> "$GITHUB_OUTPUT"
            echo "Resolved XCTest destination: ${destination}"
            device_id="${destination##*id=}"
            # Start the one selected device early while the build steps compile; never create clones.
            if ! xcrun simctl list devices booted | grep -Fq "$device_id"; then
              /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl boot "$device_id"
            fi
          } 2>&1 | tee "$RESULT_DIR/xctest-destination.log"

      - name: Generic iOS Debug build
        id: xcode_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          xcrun xcodebuild \
            -project MDJournal.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$BUILD_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/mdjournal-derived-data" \
            -resultBundlePath "$RESULT_DIR/MDJournal.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RESULT_DIR/xcodebuild.log"

      - name: Mac Catalyst Debug build
        id: maccatalyst_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          xcrun xcodebuild \
            -project MDJournal.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$MACCATALYST_BUILD_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/mdjournal-derived-data" \
            -resultBundlePath "$RESULT_DIR/MDJournalMacCatalyst.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RESULT_DIR/maccatalyst-build.log"

      - name: XCTest
        id: xcode_test
        continue-on-error: true
        shell: bash
        env:
          RESOLVED_TEST_DESTINATION: ${{ steps.test_destination.outputs.destination }}
        run: |
          set -euo pipefail
          destination="${RESOLVED_TEST_DESTINATION:-}"
          {
            echo "## XCTest destination"
            echo "$destination"
            echo
            # Boot the selected cloud device once; serial tests avoid clone startup contention.
            if [[ "$destination" != "platform=iOS Simulator,id="* ]]; then
              echo "A resolved simulator UDID is required for bounded CI preparation."
              exit 1
            fi
            device_id="${destination##*id=}"
            echo "## Build XCTest products separately (600 second limit)"
            /usr/bin/perl -e 'alarm shift; exec @ARGV' 600 \
              xcrun xcodebuild \
              -project MDJournal.xcodeproj -scheme "$SCHEME" -configuration Debug \
              -destination "$destination" -destination-timeout 60 \
              -derivedDataPath "$RUNNER_TEMP/mdjournal-derived-data" \
              -enableCodeCoverage NO CODE_SIGNING_ALLOWED=NO SWIFT_OPTIMIZATION_LEVEL=-Onone \
              build-for-testing
            echo "## Prepare selected CI simulator (240 second limit)"
            /usr/bin/perl -e 'alarm shift; exec @ARGV' 240 \
              xcrun simctl bootstatus "$device_id" -b
            echo
            # Bound simulator boot/test so a hung destination cannot block the result package forever.
            /usr/bin/perl -e 'alarm shift; exec @ARGV' 720 \
              xcrun xcodebuild \
              -project MDJournal.xcodeproj \
              -scheme "$SCHEME" \
              -configuration Debug \
              -destination "$destination" \
              -destination-timeout 60 \
              -parallel-testing-enabled NO \
              -maximum-concurrent-test-simulator-destinations 1 \
              -enableCodeCoverage NO \
              -derivedDataPath "$RUNNER_TEMP/mdjournal-derived-data" \
              -resultBundlePath "$RESULT_DIR/MDJournalTests.xcresult" \
              CODE_SIGNING_ALLOWED=NO \
              test-without-building
            xcrun xcresulttool get test-results summary \
              --path "$RESULT_DIR/MDJournalTests.xcresult" > "$RESULT_DIR/xctest-summary.json"
            python3 script/verify_xctest_summary.py "$RESULT_DIR/xctest-summary.json" MDJournalTests \
              > "$RESULT_DIR/xctest-verification.json"
          } 2>&1 | tee "$RESULT_DIR/xctest.log"

      - name: Export and verify interface review images
        id: interface_review
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            xcrun xcresulttool export attachments \
              --path "$RESULT_DIR/MDJournalTests.xcresult" \
              --output-path "$RESULT_DIR/interface-review"
            python3 - <<'PY'
          import json
          import os
          import pathlib
          import struct
          import shutil

          result_dir = pathlib.Path(os.environ["RESULT_DIR"])
          export_dir = result_dir / "interface-review"
          manifest = json.loads((export_dir / "manifest.json").read_text())
          expected = {
              "review-content-390x844-compact-library": (390, 844, "light", "large", "ContentView / compact library after real navigation pop"),
              "review-content-390x844-compact-detail": (390, 844, "light", "large", "ContentView / compact detail after real list selection"),
              "review-settings-390x844-light": (390, 844, "light", "large", "JournalSettingsView"),
              "review-settings-390x844-light-accessibility3": (390, 844, "light", "accessibility3", "JournalSettingsView"),
              "review-privacy-390x844-light": (390, 844, "light", "large", "JournalPrivacyView"),
              "review-lock-390x844-dark-presented-sheet": (390, 844, "dark", "large", "JournalPrivacyGate / window shield above presented sheet"),
              "review-pro-paywall-390x844-light": (390, 844, "light", "large", "JournalPaywallView / StoreKitTest verified purchase"),
              "review-pro-export-390x844-light-verified": (390, 844, "light", "large", "JournalPremiumExportView / StoreKitTest verified entitlement"),
              "review-pro-unavailable-390x844-light-accessibility3": (390, 844, "light", "accessibility3", "JournalPaywallView / unavailable products"),
              "review-content-1360x860-light-regular": (1360, 860, "light", "large", "ContentView / iOS regular width"),
              "review-content-1120x720-light-regular": (1120, 720, "light", "large", "ContentView / iOS regular width"),
              "review-editor-1440x900-light-split": (1440, 900, "light", "large", "EntryEditorView / split"),
              "review-editor-390x720-light": (390, 720, "light", "large", "EntryEditorView"),
              "review-editor-390x720-dark": (390, 720, "dark", "large", "EntryEditorView"),
              "review-editor-844x320-light-compact": (844, 320, "light", "large", "EntryEditorView / compact height"),
              "review-editor-390x720-light-accessibility3": (390, 720, "light", "accessibility3", "EntryEditorView"),
              "review-library-320x900-light": (320, 900, "light", "large", "EntryListView"),
              "review-library-320x900-light-history": (320, 900, "light", "large", "EntryListView / scrolled history"),
              "review-library-320x900-light-accessibility3": (320, 900, "light", "accessibility3", "EntryListView"),
              "review-statistics-1100x900-light": (1100, 900, "light", "large", "StatisticsDashboardView"),
              "review-preview-390x720-light": (390, 720, "light", "large", "MarkdownPreviewView"),
              "review-library-320x900-dark": (320, 900, "dark", "large", "EntryListView"),
              "review-empty-390x720-light": (390, 720, "light", "large", "EmptyStateView"),
              "review-statistics-390x900-light": (390, 900, "light", "large", "StatisticsDashboardView"),
              "review-statistics-390x900-light-accessibility3": (390, 900, "light", "accessibility3", "StatisticsDashboardView"),
          }
          images = {}
          benchmark_found = False
          for test in manifest:
              for attachment in test.get("attachments", []):
                  suggested = attachment.get("suggestedHumanReadableName", "")
                  name = suggested.split("_", 1)[0]
                  if name == "performance-bounded-body-derivation":
                      report_path = export_dir / attachment["exportedFileName"]
                      if not report_path.resolve().is_relative_to(export_dir.resolve()):
                          raise SystemExit("Invalid benchmark attachment path")
                      report = json.loads(report_path.read_text())
                      if report.get("resultsEquivalent") is not True or report.get("iterations") != 3:
                          raise SystemExit("The benchmark must compare equivalent results over three iterations")
                      shutil.copyfile(report_path, result_dir / "body-derivation-benchmark.json")
                      benchmark_found = True
                  if name not in expected:
                      continue
                  if name in images:
                      raise SystemExit(f"Duplicate required image: {name}")
                  image = export_dir / attachment["exportedFileName"]
                  if not image.resolve().is_relative_to(export_dir.resolve()):
                      raise SystemExit(f"Invalid exported path: {image}")
                  with image.open("rb") as handle:
                      header = handle.read(24)
                  if len(header) != 24 or header[:8] != b"\x89PNG\r\n\x1a\n" or header[12:16] != b"IHDR":
                      raise SystemExit(f"Missing or invalid PNG: {image}")
                  width, height = struct.unpack(">II", header[16:24])
                  wanted_width, wanted_height, appearance, type_size, surface = expected[name]
                  if (width, height) != (wanted_width, wanted_height):
                      raise SystemExit(f"Wrong dimensions for {name}: {width}x{height}")
                  images[name] = {
                      "name": name,
                      "testIdentifier": test.get("testIdentifier"),
                      "path": str(image.relative_to(result_dir)),
                      "width": width, "height": height,
                      "appearance": appearance, "dynamicType": type_size,
                      "surface": surface,
                      "deviceName": attachment.get("deviceName"),
                      "sourceName": suggested,
                  }
          missing = sorted(set(expected) - set(images))
          if missing:
              raise SystemExit(f"Required interface images missing: {missing}")
          if not benchmark_found:
              raise SystemExit("Missing required body derivation benchmark attachment")
          index = {
              "matrixVerified": True,
              "expectedImageCount": len(expected),
              "renderBoundary": "Production SwiftUI views rendered on CI iOS; not Mac window or interaction evidence.",
              "images": [images[name] for name in expected],
          }
          (export_dir / "index.json").write_text(json.dumps(index, ensure_ascii=False, indent=2) + "\n")
          print(f"Verified {len(images)} production interface PNGs and preserved xcresult attachment mapping.")
          PY
          } 2>&1 | tee "$RESULT_DIR/interface-review-export.log"

      - name: Build and verify universal Mac Release package
        id: mac_release
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bash script/package_macos.sh "$GITHUB_WORKSPACE/$RESULT_DIR" 2>&1 | tee "$RESULT_DIR/mac-release.log"

      - name: Write manifest and summaries
        if: always()
        shell: bash
        env:
          STATIC_OUTCOME: ${{ steps.static_checks.outcome }}
          BUILD_OUTCOME: ${{ steps.xcode_build.outcome }}
          MACCATALYST_BUILD_OUTCOME: ${{ steps.maccatalyst_build.outcome }}
          TEST_OUTCOME: ${{ steps.xcode_test.outcome }}
          INTERFACE_REVIEW_OUTCOME: ${{ steps.interface_review.outcome }}
          MAC_RELEASE_OUTCOME: ${{ steps.mac_release.outcome }}
          SIMULATOR_PREPARATION_OUTCOME: ${{ steps.test_destination.outcome }}
          RESOLVED_TEST_DESTINATION: ${{ steps.test_destination.outputs.destination }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          result_dir = pathlib.Path(os.environ["RESULT_DIR"])
          result_dir.mkdir(parents=True, exist_ok=True)

          static_outcome = os.environ["STATIC_OUTCOME"]
          build_outcome = os.environ["BUILD_OUTCOME"]
          maccatalyst_build_outcome = os.environ["MACCATALYST_BUILD_OUTCOME"]
          failures = []
          if static_outcome != "success":
              failures.append(("static-checks", static_outcome, "See ci-results/static-checks.log."))
          if build_outcome != "success":
              failures.append(("xcodebuild", build_outcome, "See ci-results/xcodebuild.log."))
          if maccatalyst_build_outcome != "success":
              failures.append(("maccatalyst-build", maccatalyst_build_outcome, "See ci-results/maccatalyst-build.log."))
          test_outcome = os.environ["TEST_OUTCOME"]
          if test_outcome != "success":
              failures.append(("xctest", test_outcome, "See ci-results/xctest.log."))
          interface_review_outcome = os.environ["INTERFACE_REVIEW_OUTCOME"]
          if interface_review_outcome != "success":
              failures.append(("interface-review", interface_review_outcome, "See ci-results/interface-review-export.log."))
          mac_release_outcome = os.environ["MAC_RELEASE_OUTCOME"]
          if mac_release_outcome != "success":
              failures.append(("mac-release", mac_release_outcome, "See ci-results/mac-release.log."))

          test_destination = os.environ.get("RESOLVED_TEST_DESTINATION") or "unresolved"

          manifest = {
              "version": os.environ["VERSION"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "commitSha": os.environ["GITHUB_SHA"],
              "shortSha": os.environ["SHORT_SHA"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflowName": os.environ["GITHUB_WORKFLOW"],
              "createdAt": datetime.now(timezone.utc).isoformat(),
              "projectName": os.environ["PROJECT_NAME"],
              "scheme": os.environ["SCHEME"],
              "destination": os.environ["BUILD_DESTINATION"],
              "buildDestination": os.environ["BUILD_DESTINATION"],
              "macCatalystBuildDestination": os.environ["MACCATALYST_BUILD_DESTINATION"],
              "testDestination": test_destination,
              "testExecutionPolicy": "serial-on-resolved-simulator",
              "testSimulatorBootTimeoutSeconds": 240,
              "testBuildTimeoutSeconds": 600,
              "testProcessTimeoutSeconds": 720,
              "ciRunner": "macos-15",
              "developerDirectory": os.environ["DEVELOPER_DIR"],
              "testRuntime": os.environ["TEST_RUNTIME"],
              "simulatorPreparationOutcome": os.environ["SIMULATOR_PREPARATION_OUTCOME"],
              "simulatorSelectionPath": "ci-results/simulator-selection.json",
              "resultBundlePath": "ci-results/MDJournal.xcresult",
              "macCatalystResultBundlePath": "ci-results/MDJournalMacCatalyst.xcresult",
              "testResultBundlePath": "ci-results/MDJournalTests.xcresult",
              "junitPath": "ci-results/junit.xml",
              "buildLogPath": "ci-results/xcodebuild.log",
              "macCatalystBuildLogPath": "ci-results/maccatalyst-build.log",
              "testLogPath": "ci-results/xctest.log",
              "failureSummaryPath": "ci-results/ci-failure-summary.md",
              "staticChecksOutcome": static_outcome,
              "buildOutcome": build_outcome,
              "macCatalystBuildOutcome": maccatalyst_build_outcome,
              "testOutcome": test_outcome,
              "interfaceReviewExportOutcome": interface_review_outcome,
              "interfaceReviewDirectoryPath": "ci-results/interface-review",
              "interfaceReviewIndexPath": "ci-results/interface-review/index.json",
              "interfaceReviewExportLogPath": "ci-results/interface-review-export.log",
              "macReleaseOutcome": mac_release_outcome,
              "macReleaseManifestPath": "ci-results/mac-release-manifest.json",
              "macReleaseResultBundlePath": "ci-results/MDJournalMacRelease.xcresult",
              "macReleaseLogPath": "ci-results/mac-release.log",
              "projectSpecificReports": ["ci-results/interface-review/index.json", "ci-results/mac-release-manifest.json"],
          }
          (result_dir / "ci-artifact-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          stages = [
              ("static-checks", static_outcome, "Static checks failed."),
              ("xcodebuild", build_outcome, "Generic iOS Debug build failed."),
              ("maccatalyst-build", maccatalyst_build_outcome, "Mac Catalyst Debug build failed."),
              ("xctest", test_outcome, "XCTest failed."),
              ("interface-review", interface_review_outcome, "Interface review image export or matrix verification failed."),
              ("mac-release", mac_release_outcome, "Universal Mac Release build or package verification failed."),
          ]
          testsuite = ET.Element(
              "testsuite",
              name="MDJournalCI",
              tests=str(len(stages)),
              failures=str(len(failures)),
              errors="0",
              skipped="0",
          )
          for name, outcome, message in stages:
              case = ET.SubElement(testsuite, "testcase", name=name)
              if outcome != "success":
                  failure = ET.SubElement(case, "failure", message=message)
                  failure.text = f"Outcome: {outcome}"
          ET.ElementTree(testsuite).write(result_dir / "junit.xml", encoding="utf-8", xml_declaration=True)

          lines = ["# CI Failure Summary", ""]
          if failures:
              lines.append("One or more CI stages failed:")
              lines.append("")
              for name, outcome, hint in failures:
                  lines.append(f"- {name}: {outcome}. {hint}")
          else:
              lines.append("All configured CI stages passed.")
          lines.append("")
          lines.append(f"Mac Catalyst build outcome: {maccatalyst_build_outcome}.")
          lines.append("")
          lines.append(f"XCTest outcome: {test_outcome}.")
          lines.append("")
          lines.append(f"Interface review export outcome: {interface_review_outcome}.")
          lines.append("")
          lines.append(f"Mac Release package outcome: {mac_release_outcome}.")
          lines.append("")
          lines.append(f"Commit: {manifest['commitSha']}")
          lines.append(f"Run: {manifest['runId']} attempt {manifest['runAttempt']}")
          (result_dir / "ci-failure-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload CI result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdjournal-ci-${{ env.VERSION }}-${{ steps.meta.outputs.branch_slug }}-${{ steps.meta.outputs.short_sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ci-results
          if-no-files-found: error

      - name: Fail workflow on failed checks
        if: always() && (steps.static_checks.outcome != 'success' || steps.xcode_build.outcome != 'success' || steps.maccatalyst_build.outcome != 'success' || steps.xcode_test.outcome != 'success' || steps.interface_review.outcome != 'success' || steps.mac_release.outcome != 'success')
        shell: bash
        run: exit 1

  ios-release:
    name: iOS 26 Release Archive
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      RESULT_DIR: ios-release-results
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive and verify iPhoneOS release
        id: archive
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"
          bash script/archive_ios_release.sh "$GITHUB_WORKSPACE/$RESULT_DIR" 2>&1 | tee "$RESULT_DIR/ios-release.log"

      - name: Write archive outcome
        if: always()
        shell: bash
        env:
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          directory = pathlib.Path(os.environ["RESULT_DIR"])
          directory.mkdir(parents=True, exist_ok=True)
          outcome = os.environ["ARCHIVE_OUTCOME"]
          manifest = {
              "version": "v0.95", "branch": os.environ["GITHUB_REF_NAME"],
              "commitSha": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"], "workflowName": os.environ["GITHUB_WORKFLOW"],
              "developerDirectory": os.environ["DEVELOPER_DIR"], "archiveOutcome": outcome,
              "archiveManifestPath": "ios-release-manifest.json", "logPath": "ios-release.log",
              "resultBundlePath": "MDJournalIOSRelease.xcresult", "appStoreUploadPerformed": False,
              "signingStatus": "unsigned-requires-developer-team-and-distribution-signing",
          }
          (directory / "ci-artifact-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          suite = ET.Element("testsuite", name="MDJournalIOSRelease", tests="1",
                             failures="0" if outcome == "success" else "1", errors="0", skipped="0")
          case = ET.SubElement(suite, "testcase", name="ios-device-release-archive")
          if outcome != "success":
              ET.SubElement(case, "failure", message="See ios-release.log").text = outcome
          ET.ElementTree(suite).write(directory / "junit.xml", encoding="utf-8", xml_declaration=True)
          (directory / "ci-failure-summary.md").write_text(
              f"# iOS Release Archive\n\nOutcome: {outcome}\n\nCommit: {manifest['commitSha']}\n"
              f"Run: {manifest['runId']} attempt {manifest['runAttempt']}\n\n"
              "The archive is unsigned. No App Store upload or review has been performed.\n")
          PY

      - name: Upload iOS release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdjournal-ios-release-v0.95-main-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            ios-release-results/ci-artifact-manifest.json
            ios-release-results/ios-release-manifest.json
            ios-release-results/ios-release.log
            ios-release-results/MDJournalIOSRelease.xcresult
            ios-release-results/MDJournal-iOS-unsigned.xcarchive.zip
            ios-release-results/junit.xml
            ios-release-results/ci-failure-summary.md
          if-no-files-found: error

      - name: Require successful archive
        if: always() && steps.archive.outcome != 'success'
        shell: bash
        run: exit 1
