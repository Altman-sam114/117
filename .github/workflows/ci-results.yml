name: MD Journal CI Results

on:
  workflow_dispatch:
    inputs:
      validation_profile:
        description: Task-scoped validation or the complete release gate
        type: choice
        options: [targeted, full]
        default: targeted
      only_testing:
        description: Space-separated MDJournalTests/Class[/testMethod] selectors (targeted only)
        type: string
        default: ''
      python_test_pattern:
        description: One exact test_*.py file under script/tests (targeted only)
        type: string
        default: ''
      build_platform:
        description: Additional Debug builds (targeted only; XCTest already builds its simulator host)
        type: choice
        options: [none, ios, catalyst, both]
        default: none

permissions:
  contents: read

jobs:
  ci-results:
    name: Validate Requested Scope
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      RESULT_DIR: ci-results
      VERSION: v0.95
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      TEST_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
      PYTHONDONTWRITEBYTECODE: '1'
      PROJECT_NAME: MD Journal
      SCHEME: MDJournalCI
      BUILD_DESTINATION: generic/platform=iOS
      MACCATALYST_BUILD_DESTINATION: generic/platform=macOS,variant=Mac Catalyst
      VALIDATION_PROFILE: ${{ inputs.validation_profile }}
      ONLY_TESTING: ${{ inputs.only_testing }}
      PYTHON_TEST_PATTERN: ${{ inputs.python_test_pattern }}
      BUILD_PLATFORM: ${{ inputs.build_platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          branch_slug="${GITHUB_REF_NAME//\//-}"
          short_sha="${GITHUB_SHA::7}"
          echo "branch_slug=${branch_slug}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Prepare result directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"

      - name: Resolve validation scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          {
            case "$BUILD_PLATFORM" in none|ios|catalyst|both) ;; *) exit 1 ;; esac
            full=false
            has_tests=false
            if [[ "$VALIDATION_PROFILE" == full ]]; then
              if [[ -n "$ONLY_TESTING$PYTHON_TEST_PATTERN" || "$BUILD_PLATFORM" != none ]]; then
                echo "Full validation does not accept targeted filters."
                exit 1
              fi
              full=true
              has_tests=true
            elif [[ "$VALIDATION_PROFILE" == targeted ]]; then
              if [[ -z "${ONLY_TESTING//[[:space:]]/}$PYTHON_TEST_PATTERN" && "$BUILD_PLATFORM" == none ]]; then
                echo "Targeted validation requires tests, a Python test file, or a build platform."
                exit 1
              fi
              if [[ -n "$PYTHON_TEST_PATTERN" ]]; then
                [[ "$PYTHON_TEST_PATTERN" =~ ^test_[a-zA-Z0-9_]+\.py$ ]]
                test -f "script/tests/$PYTHON_TEST_PATTERN"
              fi
              if [[ -n "${ONLY_TESTING//[[:space:]]/}" ]]; then
                read -r -a selectors <<< "${ONLY_TESTING//$'\n'/ }"
                selection_args=()
                for selector in "${selectors[@]}"; do
                  selection_args+=(--only-testing "$selector")
                done
                python3 script/verify_xctest_summary.py - MDJournalTests \
                  --selection-only "${selection_args[@]}" > "$RESULT_DIR/test-selection.json"
                cat "$RESULT_DIR/test-selection.json"
                has_tests=true
              fi
            else
              echo "Unknown validation profile: $VALIDATION_PROFILE"
              exit 1
            fi
            echo "full=$full" >> "$GITHUB_OUTPUT"
            echo "has_tests=$has_tests" >> "$GITHUB_OUTPUT"
            echo "Profile: $VALIDATION_PROFILE; build: $BUILD_PLATFORM; Python: $PYTHON_TEST_PATTERN"
          } 2>&1 | tee "$RESULT_DIR/scope.log"

      - name: Static checks
        id: static_checks
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## git diff --check"
            git diff --check
            echo
            if [[ "$VALIDATION_PROFILE" == full || -n "${ONLY_TESTING//[[:space:]]/}" || "$BUILD_PLATFORM" != none ]]; then
              echo "## Xcode project, App Info and privacy manifest"
              plutil -lint MDJournal.xcodeproj/project.pbxproj MDJournal/Info.plist MDJournal/PrivacyInfo.xcprivacy
            fi
            if [[ "$VALIDATION_PROFILE" == full ]]; then
              echo "## xcrun swiftc -parse"
              swift_files=$(git ls-files 'MDJournal/*.swift' 'MDJournal/**/*.swift')
              xcrun swiftc -parse -parse-as-library $swift_files
              echo "## Complete Python fixture suite"
              python3 -m unittest discover -s script/tests -v
            elif [[ -n "$PYTHON_TEST_PATTERN" ]]; then
              echo "## Selected Python fixtures: $PYTHON_TEST_PATTERN"
              python3 -m unittest discover -s script/tests -p "$PYTHON_TEST_PATTERN" -v
            fi
          } 2>&1 | tee "$RESULT_DIR/static-checks.log"

      - name: Prepare cloud simulator
        id: test_destination
        if: steps.scope.outputs.has_tests == 'true' && steps.static_checks.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Pinned toolchain and runner"
            uname -m
            xcrun xcodebuild -version
            echo "## Available runtimes (60 second limit)"
            /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl list runtimes
            echo "## Available devices (60 second limit)"
            /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 \
              xcrun simctl list devices available --json > "$RESULT_DIR/simulator-devices.json"
            destination=$(python3 script/ci_simulator.py \
              --devices "$RESULT_DIR/simulator-devices.json" --runtime "$TEST_RUNTIME" \
              --report "$RESULT_DIR/simulator-selection.json")
            echo "destination=${destination}" >> "$GITHUB_OUTPUT"
            echo "Resolved XCTest destination: ${destination}"
            device_id="${destination##*id=}"
            initial_state=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["initialState"])' \
              "$RESULT_DIR/simulator-selection.json")
            # Reuse the captured inventory instead of making another service request.
            if [[ "$initial_state" != "Booted" ]]; then
              echo "## Boot selected device (60 second limit): $device_id"
              /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl boot "$device_id"
            fi
          } 2>&1 | tee "$RESULT_DIR/xctest-destination.log"

      - name: XCTest
        id: xcode_test
        if: steps.scope.outputs.has_tests == 'true'
        continue-on-error: true
        shell: bash
        env:
          RESOLVED_TEST_DESTINATION: ${{ steps.test_destination.outputs.destination }}
          SIMULATOR_PREPARATION_OUTCOME: ${{ steps.test_destination.outcome }}
        run: |
          set -euo pipefail
          destination="${RESOLVED_TEST_DESTINATION:-}"
          {
            test_sampler=""
            stop_test_sampling() {
              if [[ -n "$test_sampler" ]]; then
                kill "$test_sampler" 2>/dev/null || true
                wait "$test_sampler" 2>/dev/null || true
                test_sampler=""
              fi
            }
            start_test_sampling() {
              local phase="$1"
              (
                process_names=(MDJournal)
                if [[ "$phase" == storekit-preflight ]]; then
                  process_names+=(storekitd ASOctaneSupportXPCService)
                fi
                iteration=0
                while sleep 25; do
                  iteration=$((iteration + 1))
                  for process_name in "${process_names[@]}"; do
                    while IFS= read -r host_pid; do
                      [[ -n "$host_pid" ]] || continue
                      /usr/bin/perl -e 'alarm shift; exec @ARGV' 10 \
                        /usr/bin/sample "$host_pid" 2 \
                        -file "$RESULT_DIR/${phase}-${process_name}-${host_pid}-${iteration}.sample.txt" || true
                    done < <(/usr/bin/pgrep -x "$process_name" || true)
                  done
                done
              ) &
              test_sampler=$!
            }
            trap stop_test_sampling EXIT
            collect_test_diagnostics() {
              local result_bundle="$1"
              local diagnostics_dir="$2"
              while IFS= read -r host_pid; do
                [[ -n "$host_pid" ]] || continue
                /usr/bin/perl -e 'alarm shift; exec @ARGV' 15 \
                  /usr/bin/sample "$host_pid" 3 \
                  -file "$RESULT_DIR/xctest-host-${host_pid}.sample.txt" || true
              done < <(/usr/bin/pgrep -x MDJournal || true)
              /usr/bin/perl -e 'alarm shift; exec @ARGV' 30 \
                xcrun xcresulttool export diagnostics \
                --path "$result_bundle" --output-path "$diagnostics_dir" || true
            }
            echo "## XCTest destination"
            echo "$destination"
            echo
            if [[ "$SIMULATOR_PREPARATION_OUTCOME" != "success" ]]; then
              echo "Cloud simulator preparation failed; see xctest-destination.log. No tests were run."
              exit 1
            fi
            # Boot the selected cloud device once; serial tests avoid clone startup contention.
            if [[ "$destination" != "platform=iOS Simulator,id="* ]]; then
              echo "A resolved simulator UDID is required for bounded CI preparation."
              exit 1
            fi
            device_id="${destination##*id=}"
            echo "## Build XCTest products separately (600 second limit)"
            /usr/bin/perl -e 'alarm shift; exec @ARGV' 600 \
              xcrun xcodebuild \
              -project MDJournal.xcodeproj -scheme "$SCHEME" -configuration Debug \
              -destination "$destination" -destination-timeout 60 \
              -derivedDataPath "$RUNNER_TEMP/mdjournal-derived-data" \
              -enableCodeCoverage NO CODE_SIGNING_ALLOWED=NO SWIFT_OPTIMIZATION_LEVEL=-Onone \
              build-for-testing
            for test_run in "$RUNNER_TEMP/mdjournal-derived-data/Build/Products/"*.xctestrun; do
              [[ -f "$test_run" ]] || continue
              cp "$test_run" "$RESULT_DIR/"
            done
            echo "## Prepare selected CI simulator (240 second limit)"
            /usr/bin/perl -e 'alarm shift; exec @ARGV' 240 \
              xcrun simctl bootstatus "$device_id" -b
            echo
            if [[ "$VALIDATION_PROFILE" == targeted ]]; then
              read -r -a selectors <<< "${ONLY_TESTING//$'\n'/ }"
              test_args=()
              verification_args=()
              for selector in "${selectors[@]}"; do
                test_args+=("-only-testing:$selector")
                verification_args+=(--only-testing "$selector")
              done
              test_status=0
              start_test_sampling targeted
              /usr/bin/perl -e 'alarm shift; exec @ARGV' 720 \
                xcrun xcodebuild \
                -project MDJournal.xcodeproj -scheme "$SCHEME" -configuration Debug \
                -destination "$destination" -destination-timeout 60 \
                -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
                -test-timeouts-enabled YES \
                -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 180 \
                "${test_args[@]}" -enableCodeCoverage NO \
                -derivedDataPath "$RUNNER_TEMP/mdjournal-derived-data" \
                -resultBundlePath "$RESULT_DIR/MDJournalTests.xcresult" \
                CODE_SIGNING_ALLOWED=NO test-without-building || test_status=$?
              stop_test_sampling
              if [[ "$test_status" -ne 0 ]]; then
                collect_test_diagnostics "$RESULT_DIR/MDJournalTests.xcresult" "$RESULT_DIR/xctest-diagnostics"
              fi
              xcrun xcresulttool get test-results summary \
                --path "$RESULT_DIR/MDJournalTests.xcresult" > "$RESULT_DIR/xctest-summary.json"
              python3 script/verify_xctest_summary.py "$RESULT_DIR/xctest-summary.json" MDJournalTests \
                "${verification_args[@]}" > "$RESULT_DIR/xctest-verification.json" || test_status=$?
              exit "$test_status"
            fi
            echo "## Isolated local StoreKit preflight (180 second limit; not the full suite)"
            preflight_failed=0
            storekit_status=0
            start_test_sampling storekit-preflight
            /usr/bin/perl -e 'alarm shift; exec @ARGV' 180 \
              xcrun xcodebuild \
              -project MDJournal.xcodeproj -scheme "$SCHEME" -configuration Debug \
              -destination "$destination" -destination-timeout 60 \
              -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 180 \
              -only-testing:MDJournalTests/JournalSubscriptionTests/testStoreKitCurrentEntitlementsPreflightUsesLocalSession \
              -only-testing:MDJournalTests/JournalSubscriptionTests/testStoreKitCancelledPurchasesDoNotUnlockPro \
              -only-testing:MDJournalTests/JournalSubscriptionTests/testStoreKitUnverifiedTransactionsDoNotUnlockPro \
              -enableCodeCoverage NO -derivedDataPath "$RUNNER_TEMP/mdjournal-derived-data" \
              -resultBundlePath "$RESULT_DIR/MDJournalStoreKitPreflight.xcresult" \
              CODE_SIGNING_ALLOWED=NO test-without-building \
              > "$RESULT_DIR/storekit-preflight.log" 2>&1 || storekit_status=$?
            stop_test_sampling
            xcrun xcresulttool get test-results summary \
              --path "$RESULT_DIR/MDJournalStoreKitPreflight.xcresult" \
              > "$RESULT_DIR/storekit-preflight-summary.json" || storekit_status=$?
            if [[ "$storekit_status" -eq 0 ]]; then
              python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); assert {k:s.get(k) for k in ("totalTestCount","passedTests","failedTests","skippedTests")} == {"totalTestCount":3,"passedTests":3,"failedTests":0,"skippedTests":0}, s' \
                "$RESULT_DIR/storekit-preflight-summary.json" || storekit_status=$?
            fi
            if [[ "$storekit_status" -ne 0 ]]; then
              echo "Local StoreKit preflight failed. Navigation preflight will still run to preserve independent diagnostics."
              collect_test_diagnostics "$RESULT_DIR/MDJournalStoreKitPreflight.xcresult" \
                "$RESULT_DIR/storekit-preflight-diagnostics"
              preflight_failed=1
            fi
            echo "## App Scene navigation and editor binding preflight (240 second limit; not the full suite)"
            preflight_status=0
            start_test_sampling navigation-preflight
            /usr/bin/perl -e 'alarm shift; exec @ARGV' 240 \
              xcrun xcodebuild \
              -project MDJournal.xcodeproj -scheme "$SCHEME" -configuration Debug \
              -destination "$destination" -destination-timeout 60 \
              -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 180 \
              -only-testing:MDJournalTests/JournalInterfaceTests/testCompactProductionCreateClearsBlockingFiltersAndShowsTheCreatedID \
              -only-testing:MDJournalTests/JournalInterfaceTests/testCompactProductionNavigationLinkOpensPopsAndReopensTheSameEntry \
              -only-testing:MDJournalTests/JournalInterfaceTests/testProductionDoneAndWritingActionsCoordinateTitleAndBodyFirstResponders \
              -only-testing:MDJournalTests/JournalInterfaceTests/testProductionMarkedCompositionStaysWithItsJournalWhenBindingsChange \
              -enableCodeCoverage NO -derivedDataPath "$RUNNER_TEMP/mdjournal-derived-data" \
              -resultBundlePath "$RESULT_DIR/MDJournalNavigationPreflight.xcresult" \
              CODE_SIGNING_ALLOWED=NO test-without-building \
              > "$RESULT_DIR/navigation-preflight.log" 2>&1 || preflight_status=$?
            stop_test_sampling
            xcrun xcresulttool get test-results summary \
              --path "$RESULT_DIR/MDJournalNavigationPreflight.xcresult" \
              > "$RESULT_DIR/navigation-preflight-summary.json" || preflight_status=$?
            if [[ "$preflight_status" -eq 0 ]]; then
              python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); assert {k:s.get(k) for k in ("totalTestCount","passedTests","failedTests","skippedTests")} == {"totalTestCount":4,"passedTests":4,"failedTests":0,"skippedTests":0}, s' \
                "$RESULT_DIR/navigation-preflight-summary.json" || preflight_status=$?
            fi
            if [[ "$preflight_status" -ne 0 ]]; then
              echo "App Scene navigation preflight failed. See navigation-preflight.log."
              collect_test_diagnostics "$RESULT_DIR/MDJournalNavigationPreflight.xcresult" \
                "$RESULT_DIR/navigation-preflight-diagnostics"
              preflight_failed=1
            fi
            if [[ "$preflight_failed" -ne 0 ]]; then
              echo "Preflight failed; the complete suite was not run and this revision cannot pass the release gate."
              exit 1
            fi
            echo "Local StoreKit and App Scene navigation preflight passed; running the complete declared suite."
            # Bound simulator boot/test so a hung destination cannot block the result package forever.
            test_status=0
            start_test_sampling full-suite
            /usr/bin/perl -e 'alarm shift; exec @ARGV' 720 \
              xcrun xcodebuild \
              -project MDJournal.xcodeproj \
              -scheme "$SCHEME" \
              -configuration Debug \
              -destination "$destination" \
              -destination-timeout 60 \
              -parallel-testing-enabled NO \
              -maximum-concurrent-test-simulator-destinations 1 \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 180 \
              -maximum-test-execution-time-allowance 180 \
              -enableCodeCoverage NO \
              -derivedDataPath "$RUNNER_TEMP/mdjournal-derived-data" \
              -resultBundlePath "$RESULT_DIR/MDJournalTests.xcresult" \
              CODE_SIGNING_ALLOWED=NO \
              test-without-building || test_status=$?
            stop_test_sampling
            if [[ "$test_status" -ne 0 ]]; then
              # Preserve a stuck host's stack before runner cleanup, even if xcresult did not finish.
              collect_test_diagnostics "$RESULT_DIR/MDJournalTests.xcresult" "$RESULT_DIR/xctest-diagnostics"
            fi
            xcrun xcresulttool get test-results summary \
              --path "$RESULT_DIR/MDJournalTests.xcresult" > "$RESULT_DIR/xctest-summary.json"
            python3 script/verify_xctest_summary.py "$RESULT_DIR/xctest-summary.json" MDJournalTests \
              > "$RESULT_DIR/xctest-verification.json" || test_status=$?
            exit "$test_status"
          } 2>&1 | tee "$RESULT_DIR/xctest.log"

      - name: Export and verify interface review images
        id: interface_review
        if: always() && steps.scope.outputs.full == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            xcrun xcresulttool export attachments \
              --path "$RESULT_DIR/MDJournalTests.xcresult" \
              --output-path "$RESULT_DIR/interface-review"
            python3 - <<'PY'
          import json
          import os
          import pathlib
          import struct
          import shutil

          result_dir = pathlib.Path(os.environ["RESULT_DIR"])
          export_dir = result_dir / "interface-review"
          manifest = json.loads((export_dir / "manifest.json").read_text())
          expected = {
              "review-content-390x844-compact-library": (390, 844, "light", "large", "ContentView / compact initial library before real list selection"),
              "review-content-390x844-compact-detail": (390, 844, "light", "large", "ContentView / compact detail after real list selection"),
              "review-settings-390x844-light": (390, 844, "light", "large", "JournalSettingsView"),
              "review-settings-390x844-light-accessibility3": (390, 844, "light", "accessibility3", "JournalSettingsView"),
              "review-privacy-390x844-light": (390, 844, "light", "large", "JournalPrivacyView"),
              "review-lock-390x844-dark-presented-sheet": (390, 844, "dark", "large", "JournalPrivacyGate / window shield above presented sheet"),
              "review-pro-paywall-390x844-light": (390, 844, "light", "large", "JournalPaywallView / StoreKitTest product catalog before purchase"),
              "review-pro-export-390x844-light-verified": (390, 844, "light", "large", "JournalPremiumExportView / StoreKitTest verified entitlement"),
              "review-pro-unavailable-390x844-light-accessibility3": (390, 844, "light", "accessibility3", "JournalPaywallView / unavailable products"),
              "review-content-1360x860-light-regular": (1360, 860, "light", "large", "ContentView / iOS regular width"),
              "review-content-1120x720-light-regular": (1120, 720, "light", "large", "ContentView / iOS regular width"),
              "review-editor-1440x900-light-split": (1440, 900, "light", "large", "EntryEditorView / split"),
              "review-editor-390x720-light": (390, 720, "light", "large", "EntryEditorView"),
              "review-editor-390x720-dark": (390, 720, "dark", "large", "EntryEditorView"),
              "review-editor-844x320-light-compact": (844, 320, "light", "large", "EntryEditorView / compact height"),
              "review-editor-390x720-light-accessibility3": (390, 720, "light", "accessibility3", "EntryEditorView"),
              "review-library-320x900-light": (320, 900, "light", "large", "EntryListView"),
              "review-library-320x900-light-history": (320, 900, "light", "large", "EntryListView / scrolled history"),
              "review-library-320x900-light-accessibility3": (320, 900, "light", "accessibility3", "EntryListView"),
              "review-statistics-1100x900-light": (1100, 900, "light", "large", "StatisticsDashboardView"),
              "review-preview-390x720-light": (390, 720, "light", "large", "MarkdownPreviewView"),
              "review-library-320x900-dark": (320, 900, "dark", "large", "EntryListView"),
              "review-empty-390x720-light": (390, 720, "light", "large", "EmptyStateView"),
              "review-statistics-390x900-light": (390, 900, "light", "large", "StatisticsDashboardView"),
              "review-statistics-390x900-light-accessibility3": (390, 900, "light", "accessibility3", "StatisticsDashboardView"),
          }
          images = {}
          benchmark_found = False
          for test in manifest:
              for attachment in test.get("attachments", []):
                  suggested = attachment.get("suggestedHumanReadableName", "")
                  name = suggested.split("_", 1)[0]
                  if name == "performance-bounded-body-derivation":
                      report_path = export_dir / attachment["exportedFileName"]
                      if not report_path.resolve().is_relative_to(export_dir.resolve()):
                          raise SystemExit("Invalid benchmark attachment path")
                      report = json.loads(report_path.read_text())
                      if report.get("resultsEquivalent") is not True or report.get("iterations") != 3:
                          raise SystemExit("The benchmark must compare equivalent results over three iterations")
                      shutil.copyfile(report_path, result_dir / "body-derivation-benchmark.json")
                      benchmark_found = True
                  if name not in expected:
                      continue
                  if name in images:
                      raise SystemExit(f"Duplicate required image: {name}")
                  image = export_dir / attachment["exportedFileName"]
                  if not image.resolve().is_relative_to(export_dir.resolve()):
                      raise SystemExit(f"Invalid exported path: {image}")
                  with image.open("rb") as handle:
                      header = handle.read(24)
                  if len(header) != 24 or header[:8] != b"\x89PNG\r\n\x1a\n" or header[12:16] != b"IHDR":
                      raise SystemExit(f"Missing or invalid PNG: {image}")
                  width, height = struct.unpack(">II", header[16:24])
                  wanted_width, wanted_height, appearance, type_size, surface = expected[name]
                  if (width, height) != (wanted_width, wanted_height):
                      raise SystemExit(f"Wrong dimensions for {name}: {width}x{height}")
                  images[name] = {
                      "name": name,
                      "testIdentifier": test.get("testIdentifier"),
                      "path": str(image.relative_to(result_dir)),
                      "width": width, "height": height,
                      "appearance": appearance, "dynamicType": type_size,
                      "surface": surface,
                      "deviceName": attachment.get("deviceName"),
                      "sourceName": suggested,
                  }
          missing = sorted(set(expected) - set(images))
          if missing:
              raise SystemExit(f"Required interface images missing: {missing}")
          if not benchmark_found:
              raise SystemExit("Missing required body derivation benchmark attachment")
          index = {
              "matrixVerified": True,
              "expectedImageCount": len(expected),
              "renderBoundary": "Production SwiftUI views rendered on CI iOS; not Mac window or interaction evidence.",
              "images": [images[name] for name in expected],
          }
          (export_dir / "index.json").write_text(json.dumps(index, ensure_ascii=False, indent=2) + "\n")
          print(f"Verified {len(images)} production interface PNGs and preserved xcresult attachment mapping.")
          PY
            python3 script/package_store_screenshots.py \
              --attachments "$RESULT_DIR/interface-review" \
              --output "$RESULT_DIR/app-store-screenshots"
          } 2>&1 | tee "$RESULT_DIR/interface-review-export.log"

      - name: Generic iOS Debug build
        id: xcode_build
        if: >-
          steps.static_checks.outcome == 'success' &&
          ((steps.scope.outputs.full == 'true' && steps.xcode_test.outcome == 'success' && steps.interface_review.outcome == 'success') ||
           (steps.scope.outputs.full == 'false' && (inputs.build_platform == 'ios' || inputs.build_platform == 'both') &&
            (steps.scope.outputs.has_tests == 'false' || steps.xcode_test.outcome == 'success')))
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          xcrun xcodebuild \
            -project MDJournal.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$BUILD_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/mdjournal-derived-data" \
            -resultBundlePath "$RESULT_DIR/MDJournal.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RESULT_DIR/xcodebuild.log"

      - name: Mac Catalyst Debug build
        id: maccatalyst_build
        if: >-
          steps.static_checks.outcome == 'success' &&
          ((steps.scope.outputs.full == 'true' && steps.xcode_test.outcome == 'success' && steps.interface_review.outcome == 'success') ||
           (steps.scope.outputs.full == 'false' && (inputs.build_platform == 'catalyst' || inputs.build_platform == 'both') &&
            (steps.scope.outputs.has_tests == 'false' || steps.xcode_test.outcome == 'success')))
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          xcrun xcodebuild \
            -project MDJournal.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$MACCATALYST_BUILD_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/mdjournal-derived-data" \
            -resultBundlePath "$RESULT_DIR/MDJournalMacCatalyst.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RESULT_DIR/maccatalyst-build.log"

      - name: Build and verify universal Mac Release package
        id: mac_release
        if: always() && steps.scope.outputs.full == 'true' && steps.maccatalyst_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bash script/package_macos.sh "$GITHUB_WORKSPACE/$RESULT_DIR" 2>&1 | tee "$RESULT_DIR/mac-release.log"

      - name: Write manifest and summaries
        id: summary
        if: always()
        shell: bash
        env:
          STATIC_OUTCOME: ${{ steps.static_checks.outcome }}
          BUILD_OUTCOME: ${{ steps.xcode_build.outcome }}
          MACCATALYST_BUILD_OUTCOME: ${{ steps.maccatalyst_build.outcome }}
          TEST_OUTCOME: ${{ steps.xcode_test.outcome }}
          INTERFACE_REVIEW_OUTCOME: ${{ steps.interface_review.outcome }}
          MAC_RELEASE_OUTCOME: ${{ steps.mac_release.outcome }}
          SIMULATOR_PREPARATION_OUTCOME: ${{ steps.test_destination.outcome }}
          RESOLVED_TEST_DESTINATION: ${{ steps.test_destination.outputs.destination }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          result_dir = pathlib.Path(os.environ["RESULT_DIR"])
          result_dir.mkdir(parents=True, exist_ok=True)

          static_outcome = os.environ["STATIC_OUTCOME"]
          build_outcome = os.environ["BUILD_OUTCOME"]
          maccatalyst_build_outcome = os.environ["MACCATALYST_BUILD_OUTCOME"]
          test_outcome = os.environ["TEST_OUTCOME"]
          interface_review_outcome = os.environ["INTERFACE_REVIEW_OUTCOME"]
          mac_release_outcome = os.environ["MAC_RELEASE_OUTCOME"]
          full = os.environ["VALIDATION_PROFILE"] == "full"
          only_testing = os.environ["ONLY_TESTING"].split()
          build_platform = os.environ["BUILD_PLATFORM"]
          stages = [
              ("static-checks", static_outcome, "Static checks failed; see static-checks.log and scope.log."),
              ("xcodebuild", build_outcome, "Generic iOS Debug build failed; see xcodebuild.log."),
              ("maccatalyst-build", maccatalyst_build_outcome, "Mac Catalyst Debug build failed; see maccatalyst-build.log."),
              ("xctest", test_outcome, "XCTest failed; see xctest.log."),
              ("interface-review", interface_review_outcome, "Image export or matrix verification failed; see interface-review-export.log."),
              ("mac-release", mac_release_outcome, "Mac Release verification failed; see mac-release.log."),
          ]
          required = {"static-checks"}
          if full:
              required.update(name for name, _, _ in stages)
          else:
              if only_testing:
                  required.add("xctest")
              if build_platform in ("ios", "both"):
                  required.add("xcodebuild")
              if build_platform in ("catalyst", "both"):
                  required.add("maccatalyst-build")
          configured_stages = [stage for stage in stages if stage[0] in required]
          failures = [stage for stage in configured_stages if stage[1] != "success"]
          scope_valid = os.environ["SCOPE_OUTCOME"] == "success"
          passed = scope_valid and not failures

          test_destination = os.environ.get("RESOLVED_TEST_DESTINATION") or None

          manifest = {
              "version": os.environ["VERSION"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "commitSha": os.environ["GITHUB_SHA"],
              "shortSha": os.environ["SHORT_SHA"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflowName": os.environ["GITHUB_WORKFLOW"],
              "createdAt": datetime.now(timezone.utc).isoformat(),
              "projectName": os.environ["PROJECT_NAME"],
              "scheme": os.environ["SCHEME"],
              "validationProfile": os.environ["VALIDATION_PROFILE"],
              "validationScope": {
                  "onlyTesting": only_testing,
                  "pythonTestPattern": "test_*.py" if full else os.environ["PYTHON_TEST_PATTERN"] or None,
                  "buildPlatform": "both" if full else build_platform,
                  "releaseArchives": full,
              },
              "scopeOutcome": os.environ["SCOPE_OUTCOME"],
              "requiredStages": [name for name, _, _ in configured_stages],
              "notSelectedStages": [name for name, _, _ in stages if name not in required],
              "validationPassed": passed,
              "fullReleaseGateRequested": full,
              "scopeLogPath": "ci-results/scope.log",
              "destination": os.environ["BUILD_DESTINATION"],
              "buildDestination": os.environ["BUILD_DESTINATION"],
              "macCatalystBuildDestination": os.environ["MACCATALYST_BUILD_DESTINATION"],
              "testDestination": test_destination,
              "testExecutionPolicy": "serial-on-resolved-simulator",
              "simulatorInventoryTimeoutSeconds": 60,
              "simulatorPreparationStepTimeoutSeconds": 240,
              "testSimulatorBootTimeoutSeconds": 240,
              "testBuildTimeoutSeconds": 600,
              "testProcessTimeoutSeconds": 720,
              "testTimeoutsEnabled": True,
              "testDefaultExecutionTimeAllowanceSeconds": 180,
              "testMaximumExecutionTimeAllowanceSeconds": 180,
              "navigationHostExecutionTimeAllowanceSeconds": 60,
              "navigationPreflightTestCount": 4 if full else 0,
              "navigationPreflightSummaryPath": "ci-results/navigation-preflight-summary.json" if full else None,
              "navigationPreflightResultBundlePath": "ci-results/MDJournalNavigationPreflight.xcresult" if full else None,
              "storeKitPreflightTestCount": 3 if full else 0,
              "storeKitPreflightSummaryPath": "ci-results/storekit-preflight-summary.json" if full else None,
              "storeKitPreflightResultBundlePath": "ci-results/MDJournalStoreKitPreflight.xcresult" if full else None,
              "testPlanPath": "MDJournalCI.xctestplan",
              "testHostSampleIntervalSeconds": 25,
              "ciRunner": "macos-15",
              "developerDirectory": os.environ["DEVELOPER_DIR"],
              "testRuntime": os.environ["TEST_RUNTIME"],
              "simulatorPreparationOutcome": os.environ["SIMULATOR_PREPARATION_OUTCOME"],
              "simulatorSelectionPath": "ci-results/simulator-selection.json" if "xctest" in required else None,
              "resultBundlePath": "ci-results/MDJournal.xcresult" if "xcodebuild" in required else None,
              "macCatalystResultBundlePath": "ci-results/MDJournalMacCatalyst.xcresult" if "maccatalyst-build" in required else None,
              "testResultBundlePath": "ci-results/MDJournalTests.xcresult" if "xctest" in required else None,
              "junitPath": "ci-results/junit.xml",
              "buildLogPath": "ci-results/xcodebuild.log" if "xcodebuild" in required else None,
              "macCatalystBuildLogPath": "ci-results/maccatalyst-build.log" if "maccatalyst-build" in required else None,
              "testLogPath": "ci-results/xctest.log" if "xctest" in required else None,
              "failureSummaryPath": "ci-results/ci-failure-summary.md",
              "staticChecksOutcome": static_outcome,
              "buildOutcome": build_outcome,
              "macCatalystBuildOutcome": maccatalyst_build_outcome,
              "testOutcome": test_outcome,
              "interfaceReviewExportOutcome": interface_review_outcome,
              "interfaceReviewDirectoryPath": "ci-results/interface-review" if full else None,
              "interfaceReviewIndexPath": "ci-results/interface-review/index.json" if full else None,
              "interfaceReviewExportLogPath": "ci-results/interface-review-export.log" if full else None,
              "appStoreScreenshotsIndexPath": "ci-results/app-store-screenshots/index.json" if full else None,
              "macReleaseOutcome": mac_release_outcome,
              "macReleaseManifestPath": "ci-results/mac-release-manifest.json" if full else None,
              "macReleaseResultBundlePath": "ci-results/MDJournalMacRelease.xcresult" if full else None,
              "macReleaseLogPath": "ci-results/mac-release.log" if full else None,
              "projectSpecificReports": [
                  f"ci-results/{path}" for path in (
                      "test-selection.json", "xctest-verification.json", "interface-review/index.json",
                      "app-store-screenshots/index.json", "mac-release-manifest.json",
                  ) if (result_dir / path).is_file()
              ],
          }
          (result_dir / "ci-artifact-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          testsuite = ET.Element(
              "testsuite",
              name="MDJournalCI",
              tests=str(len(configured_stages)),
              failures=str(len(failures)),
              errors="0",
              skipped="0",
          )
          for name, outcome, message in configured_stages:
              case = ET.SubElement(testsuite, "testcase", name=name)
              if outcome != "success":
                  failure = ET.SubElement(case, "failure", message=message)
                  failure.text = f"Outcome: {outcome}"
          ET.ElementTree(testsuite).write(result_dir / "junit.xml", encoding="utf-8", xml_declaration=True)

          lines = ["# CI Failure Summary", ""]
          lines.append(f"Profile: {os.environ['VALIDATION_PROFILE']}")
          lines.append(f"Requested scope: {json.dumps(manifest['validationScope'])}")
          lines.append(f"Scope resolution: {os.environ['SCOPE_OUTCOME']}")
          lines.append(f"Not selected (not a pass): {', '.join(manifest['notSelectedStages']) or 'none'}")
          lines.append("")
          if failures:
              lines.append("One or more CI stages failed:")
              lines.append("")
              for name, outcome, hint in failures:
                  lines.append(f"- {name}: {outcome}. {hint}")
          elif passed:
              lines.append("All configured CI stages passed.")
          else:
              lines.append("Scope resolution failed; this run cannot pass. See scope.log.")
          lines.append("")
          lines.append(f"Mac Catalyst build outcome: {maccatalyst_build_outcome}.")
          lines.append("")
          lines.append(f"XCTest outcome: {test_outcome}.")
          lines.append("")
          lines.append(f"Interface review export outcome: {interface_review_outcome}.")
          lines.append("")
          lines.append(f"Mac Release package outcome: {mac_release_outcome}.")
          lines.append("")
          lines.append(f"Commit: {manifest['commitSha']}")
          lines.append(f"Run: {manifest['runId']} attempt {manifest['runAttempt']}")
          (result_dir / "ci-failure-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"passed={str(passed).lower()}\n")
          PY

      - name: Upload CI result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdjournal-ci-${{ env.VERSION }}-${{ inputs.validation_profile }}-${{ steps.meta.outputs.branch_slug }}-${{ steps.meta.outputs.short_sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ci-results
          if-no-files-found: error

      - name: Fail workflow on failed checks
        if: always() && steps.summary.outputs.passed != 'true'
        shell: bash
        run: exit 1

  ios-release:
    name: iOS 26 Release Archive
    if: >-
      github.ref == 'refs/heads/main' && inputs.validation_profile == 'full' &&
      inputs.only_testing == '' && inputs.python_test_pattern == '' && inputs.build_platform == 'none'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      RESULT_DIR: ios-release-results
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive and verify iPhoneOS release
        id: archive
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"
          bash script/archive_ios_release.sh "$GITHUB_WORKSPACE/$RESULT_DIR" 2>&1 | tee "$RESULT_DIR/ios-release.log"

      - name: Write archive outcome
        if: always()
        shell: bash
        env:
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          directory = pathlib.Path(os.environ["RESULT_DIR"])
          directory.mkdir(parents=True, exist_ok=True)
          outcome = os.environ["ARCHIVE_OUTCOME"]
          manifest = {
              "version": "v0.95", "branch": os.environ["GITHUB_REF_NAME"],
              "commitSha": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"], "workflowName": os.environ["GITHUB_WORKFLOW"],
              "validationProfile": "full",
              "developerDirectory": os.environ["DEVELOPER_DIR"], "archiveOutcome": outcome,
              "archiveManifestPath": "ios-release-manifest.json", "logPath": "ios-release.log",
              "resultBundlePath": "MDJournalIOSRelease.xcresult", "appStoreUploadPerformed": False,
              "signingStatus": "unsigned-requires-developer-team-and-distribution-signing",
          }
          (directory / "ci-artifact-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          suite = ET.Element("testsuite", name="MDJournalIOSRelease", tests="1",
                             failures="0" if outcome == "success" else "1", errors="0", skipped="0")
          case = ET.SubElement(suite, "testcase", name="ios-device-release-archive")
          if outcome != "success":
              ET.SubElement(case, "failure", message="See ios-release.log").text = outcome
          ET.ElementTree(suite).write(directory / "junit.xml", encoding="utf-8", xml_declaration=True)
          (directory / "ci-failure-summary.md").write_text(
              f"# iOS Release Archive\n\nOutcome: {outcome}\n\nCommit: {manifest['commitSha']}\n"
              f"Run: {manifest['runId']} attempt {manifest['runAttempt']}\n\n"
              "The archive is unsigned. No App Store upload or review has been performed.\n")
          PY

      - name: Upload iOS release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdjournal-ios-release-v0.95-main-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            ios-release-results/ci-artifact-manifest.json
            ios-release-results/ios-release-manifest.json
            ios-release-results/ios-release.log
            ios-release-results/MDJournalIOSRelease.xcresult
            ios-release-results/MDJournal-iOS-unsigned.xcarchive.zip
            ios-release-results/junit.xml
            ios-release-results/ci-failure-summary.md
          if-no-files-found: error

      - name: Require successful archive
        if: always() && steps.archive.outcome != 'success'
        shell: bash
        run: exit 1
